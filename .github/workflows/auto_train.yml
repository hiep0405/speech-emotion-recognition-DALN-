name: SER Continuous Integration & Training Trigger

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Validate Code & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Lint & Type Checkers
        run: |
          pip install flake8

      - name: Check Code Syntax
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
